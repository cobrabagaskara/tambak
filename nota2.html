<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Nota Thermal 58mm</title>

  <style>
    /* =====================
       SETUP PRINT 58mm
    ====================== */
    @page {
      size: 58mm auto;
      margin: 0;
    }

    @media print {
      body {
        width: 58mm;
        margin: 0;
        padding: 0;
        font-family: monospace;
        font-size: 11px;
        color: #000;
      }

      .no-print {
        display: none !important;
      }

      .receipt {
        width: 100%;
        padding: 4px;
        box-sizing: border-box;
      }
    }

    /* =====================
       MODE LAYAR
    ====================== */
    body {
      background: #f0f0f0;
      padding: 10px;
    }

    .receipt {
      width: 58mm;
      background: #fff;
      margin: auto;
      padding: 6px;
      box-shadow: 0 0 6px rgba(0,0,0,.2);
      box-sizing: border-box;
    }

    .center {
      text-align: center;
    }

    .line {
      border-top: 1px dashed #000;
      margin: 4px 0;
    }

    .row {
      display: flex;
      justify-content: space-between;
    }

    .bold {
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ===== STRUK ===== -->
  <div class="receipt">

    <div class="center bold">
      SPBU ABC<br>
      Jl. Contoh No. 123<br>
      Telp 0812-xxxx-xxxx
    </div>

    <div class="line"></div>

    <div>
      Tgl : <span id="tgl">09-02-2026</span><br>
      Jam : <span id="jam">14:32</span><br>
      No  : <span id="nota">000123</span>
    </div>

    <div class="line"></div>

    <div class="row">
      <span>Pertalite</span>
      <span>50.000</span>
    </div>

    <div class="row">
      <span>Liter</span>
      <span>10.25</span>
    </div>

    <div class="line"></div>

    <div class="row bold">
      <span>Total</span>
      <span>Rp 50.000</span>
    </div>

    <div class="line"></div>

    <div class="center">
      Terima Kasih 🙏<br>
      Selamat Jalan
    </div>

  </div>

  <!-- ===== TOMBOL ===== -->
  <div class="no-print">
    <button onclick="window.print()">Print Struk</button>
  </div>

</body>
</html>
